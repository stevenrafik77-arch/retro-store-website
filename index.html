<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Retro Store - Your premium destination for vintage radios, cameras, TVs, and classic electronics.">
    <meta name="keywords" content="vintage, retro, shop, electronics, antique cameras, classic radio">
    <title>Retro Store - Vintage Shop</title>

    <!-- Fonts and Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Link external CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <header>
        <div class="container header-content">
            <h1 class="retro-text">RETRO STORE</h1>
            
            <div class="search-container" role="search">
                <label for="search-input" class="visually-hidden">Search products</label>
                <input type="text" id="search-input" placeholder="Search for a vintage treasure..." onkeyup="searchProducts()" aria-label="Search for products">
                <span class="search-icon" aria-hidden="true">🔍</span>
                
                <div class="promo-banner">
                    <span>Vintage clearance sale ends in:</span>
                    <time id="countdown" class="nixie-clock" aria-live="polite">00:00:00</time>
                </div>
            </div>

            <nav class="categories-bar" aria-label="Product categories">
                <button type="button" class="cat-btn active" onclick="filterCategory('All', this)">All</button>
                <button type="button" class="cat-btn" onclick="filterCategory('Radio', this)">Radio</button>
                <button type="button" class="cat-btn" onclick="filterCategory('Cameras', this)">Cameras</button>
                <button type="button" class="cat-btn" onclick="filterCategory('TV', this)">TV</button>
                <button type="button" class="cat-btn" onclick="filterCategory('Phones', this)">Phones</button>
            </nav>
        </div>
    </header>

    <main class="living-room">
        <section class="products-grid" id="products-list" aria-label="Products display">
            <!-- Products generated by script.js -->
        </section>
    </main>

    <!-- Floating Cart Button -->
    <button class="floating-cart" onclick="toggleCart()" aria-label="View shopping cart">
        <div class="cart-emoji" aria-hidden="true">🛒</div>
        <div class="cart-badge" id="cart-count" aria-live="polite">0</div>
        <span class="cart-label">Cart</span>
    </button>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
        <div class="retro-paper">
            <button class="close-btn" onclick="toggleCart()" aria-label="Close cart">&times;</button>
            <h2 id="modal-title" class="modal-title">Shopping List</h2>
            <div id="cart-items"></div>
            <hr class="dashed-line">
            <div class="cart-total">
                <h3>Total: <span id="total-price">0</span> AED</h3>
            </div>
            <button type="button" class="action-btn" onclick="checkout()">Checkout Now</button>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> Retro Store. All rights reserved.</p>
    </footer>

    <!-- Retro Click Sound -->
    <audio id="click-sound" src="assets/sounds/click.mp3" preload="auto"></audio>

    <!-- Link external JS -->
    <script src="assets/script.js"></script>
</body>
</html>
