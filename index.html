<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Store - Vintage Shop</title>
    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>

    <header>
        <div class="store-logo">
            <span class="retro-text">RETRO STORE</span>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for a vintage treasure..." onkeyup="searchProducts()">
                <span class="search-icon">🔍</span>
                <div class="promo-banner">
                    <p>Vintage clearance sale ends in:</p>
                    <div id="countdown" class="nixie-clock">00:00:00</div>
                </div>
            </div>
            <div class="categories-bar">
                <button class="cat-btn active" onclick="filterCategory('All', this)">All</button>
                <button class="cat-btn" onclick="filterCategory('Radio', this)">Radio</button>
                <button class="cat-btn" onclick="filterCategory('Cameras', this)">Cameras</button>
                <button class="cat-btn" onclick="filterCategory('TV', this)">TV</button>
                <button class="cat-btn" onclick="filterCategory('Phones', this)">Phones</button>
            </div>
        </div>
    </header>

    <main class="living-room">
        <div class="products-grid" id="products-list">
            <!-- Products generated by script.js -->
        </div>
    </main>

    <!-- Floating Cart Button -->
    <div class="floating-cart" onclick="toggleCart()">
        <div class="cart-emoji">🛒</div>
        <div class="cart-badge" id="cart-count">0</div>
        <span class="cart-label">Cart</span>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
        <div class="retro-paper">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2 class="modal-title">Shopping List</h2>
            <div id="cart-items"></div>
            <hr class="dashed-line">
            <h3>Total: <span id="total-price">0</span> AED</h3>
            <button class="action-btn" onclick="checkout()">Checkout Now</button>
        </div>
    </div>

    <!-- Retro Click Sound -->
    <audio id="click-sound" src="https://www.soundjay.com" preload="auto"></audio>

    <!-- Link external JS -->
    <script src="script.js"></script>
</body>
</html>
